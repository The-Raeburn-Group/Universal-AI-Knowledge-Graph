name: Format DR fixture

on:
  push:
    branches: [feat/postgres-backup-restore-drill]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/postgres-backup-restore-drill
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.8.4
      - name: Apply safe import-order fix
        run: ruff check scripts/seed_dr_fixture.py --select I --fix
      - name: Commit formatter output when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/seed_dr_fixture.py
          git commit -m 'style(dr): normalize fixture imports'
          git push origin HEAD:feat/postgres-backup-restore-drill
