name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install local OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr fonts-dejavu-core
          pdftoppm -v
          tesseract --version

      - name: Install deterministic dependencies
        run: make install

      - name: Validate software supply-chain policy
        run: make supply-chain

      - name: Audit Python dependencies
        run: make audit

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Test
        run: make test

      - name: Build package
        run: make build

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ukg
          POSTGRES_PASSWORD: ukg
          POSTGRES_DB: ukg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ukg -d ukg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UKG_STORAGE_BACKEND: postgres
      UKG_DATABASE_URL: postgresql+psycopg://ukg:ukg@localhost:5432/ukg
      UKG_RESTORE_DATABASE_URL: postgresql+psycopg://ukg:ukg@localhost:5432/ukg_restore
      UKG_EMBEDDING_PROVIDER: local-hash
      UKG_EMBEDDING_DIMENSIONS: "384"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deterministic dependencies
        run: make install

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pg_dump --version
          pg_restore --version

      - name: Apply migrations to fresh pgvector database
        run: make db-migrate

      - name: Prove migrations are idempotent
        run: make db-migrate

      - name: Verify migration head
        run: make db-current

      - name: Verify API, persistent workspace isolation and DSAR erasure isolation
        run: pytest -q tests/test_api.py tests/test_postgres_store.py tests/test_postgres_privacy.py --no-cov

      - name: Seed backup and restore fixture
        run: python scripts/seed_dr_fixture.py

      - name: Create manifest-verified logical backup
        run: make db-backup

      - name: Create isolated restore database
        env:
          PGPASSWORD: ukg
        run: createdb --host localhost --port 5432 --username ukg ukg_restore

      - name: Restore into isolated database
        run: make db-restore

      - name: Verify restored schema is current and forward-fix safe
        env:
          UKG_DATABASE_URL: ${{ env.UKG_RESTORE_DATABASE_URL }}
        run: |
          make db-current
          make db-migrate
          make db-current

      - name: Verify restored data, ACLs and lifecycle state against backup manifest
        env:
          UKG_DATABASE_URL: ${{ env.UKG_RESTORE_DATABASE_URL }}
        run: make db-verify-restore

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build deterministic container image
        run: make docker-build IMAGE_TAG=${{ github.sha }}
      - name: Scan container for High/Critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: universal-ai-knowledge-graph:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Initialise CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: python
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Dependency review when GitHub Advanced Security is available
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
