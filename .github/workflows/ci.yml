name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: make install

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Test
        run: make test

      - name: Build package
        run: make build

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ukg
          POSTGRES_PASSWORD: ukg
          POSTGRES_DB: ukg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ukg -d ukg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UKG_STORAGE_BACKEND: postgres
      UKG_DATABASE_URL: postgresql+psycopg://ukg:ukg@localhost:5432/ukg
      UKG_EMBEDDING_PROVIDER: local-hash
      UKG_EMBEDDING_DIMENSIONS: "384"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: make install

      - name: Apply migrations to fresh pgvector database
        run: make db-migrate

      - name: Prove migrations are idempotent
        run: make db-migrate

      - name: Verify migration head
        run: make db-current

      - name: Verify API and persistent workspace isolation
        run: pytest -q tests/test_api.py tests/test_postgres_store.py --no-cov

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: make docker-build

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Dependency review when GitHub Advanced Security is available
        uses: actions/dependency-review-action@v4
