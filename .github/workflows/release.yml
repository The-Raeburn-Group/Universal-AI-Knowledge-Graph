name: Release trust package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install local OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr fonts-dejavu-core
          pdftoppm -v
          tesseract --version

      - name: Install deterministic dependencies
        run: make install

      - name: Validate software supply-chain policy
        run: make supply-chain

      - name: Audit Python dependencies
        run: make audit

      - name: Run quality checks
        run: |
          make lint
          make typecheck
          make test
          make build

      - name: Build deterministic container image
        run: make docker-build IMAGE_TAG=${{ github.sha }}

      - name: Scan container for High/Critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: universal-ai-knowledge-graph:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum dist/* sbom.spdx.json sbom.cdx.json > SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159

      - name: Sign release artifacts and trust metadata
        shell: bash
        run: |
          set -euo pipefail
          for artifact in dist/*; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore" "$artifact"
          done
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore SHA256SUMS
          cosign sign-blob --yes --bundle sbom.spdx.json.sigstore sbom.spdx.json
          cosign sign-blob --yes --bundle sbom.cdx.json.sigstore sbom.cdx.json

      - name: Attest package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Attest SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/*'
          sbom-path: sbom.spdx.json

      - name: Attest CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/*'
          sbom-path: sbom.cdx.json

      - name: Create verification guide
        shell: bash
        run: |
          cat > TRUST-PACKAGE.txt <<'EOF'
          Universal AI Knowledge Graph release trust package

          Release publication is blocked by repository quality checks, known Python dependency
          vulnerabilities, High/Critical container findings, build failure or supply-chain policy drift.

          Verify checksums:
            sha256sum -c SHA256SUMS

          Verify GitHub provenance:
            gh attestation verify <artifact> --repo ${{ github.repository }}

          Verify a Sigstore bundle:
            cosign verify-blob --bundle <file>.sigstore <file>
          EOF

      - name: Publish release and trust package
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            SHA256SUMS
            sbom.spdx.json
            sbom.cdx.json
            SHA256SUMS.sigstore
            sbom.spdx.json.sigstore
            sbom.cdx.json.sigstore
            TRUST-PACKAGE.txt
